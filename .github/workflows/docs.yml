name: Docs

# Builds the documentation site (docs-site/) and publishes it to GitHub Pages.
# The build runs as a check on every push and pull request; the deploy only runs on master while the repository is public
# (GitHub Pages needs a paid plan for private repositories).

on:
  push:
    branches: [master]
    paths:
      - docs-site/**
      - XivMcp/**
      - XivMcp.Core/**
      - branding/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs-site/**
      - XivMcp/**
      - XivMcp.Core/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci

      # prebuild regenerates the tools reference from the C# catalogs, so it always matches this commit.
      - run: npm run build
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && !github.event.repository.private
        with:
          path: docs-site/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
